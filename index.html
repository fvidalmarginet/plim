<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detector d’iris</title>
<style>
:root{box-sizing:border-box}
*{box-sizing:inherit}
html,body{height:100%;margin:0;background:#101418;color:#eef1f4;font:16px/1.4 system-ui,sans-serif}
#stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
video,canvas{position:absolute;max-width:100%;max-height:100%;transform:scaleX(-1)}
#msg{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center;padding:24px;background:#101418}
button{font:inherit;font-weight:600;padding:12px 22px;border:0;border-radius:8px;background:#8fd6cb;color:#0b1412}
#st{position:absolute;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:1;background:#000a;padding:3px 9px;border-radius:6px;font-size:.85rem}
</style>
</head>
<body>
<div id="stage">
  <video id="v" playsinline muted></video>
  <canvas id="c"></canvas>
  <div id="st" hidden></div>
  <div id="msg"><button id="go">Activa la càmera</button><small id="info">El vídeo es processa al teu dispositiu.</small></div>
</div>
<script type="module">
import {FaceLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const BASE="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL="https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
const $=id=>document.getElementById(id),v=$("v"),c=$("c"),x=c.getContext("2d"),st=$("st");
let lm,last=-1;
// Iris: centre + 4 points on the edge (right eye 468-472, left eye 473-477)
const IRIS=[[468,469,470,471,472],[473,474,475,476,477]];
function draw(L){
  x.clearRect(0,0,c.width,c.height);
  const lw=Math.max(2,c.width/320);
  for(const ids of IRIS){
    const p=ids.map(i=>({x:L[i].x*c.width,y:L[i].y*c.height}));
    const r=p.slice(1).reduce((s,q)=>s+Math.hypot(q.x-p[0].x,q.y-p[0].y),0)/4;
    x.strokeStyle="#33f0c8";x.fillStyle="#33f0c8";x.lineWidth=lw;
    x.beginPath();x.arc(p[0].x,p[0].y,r,0,Math.PI*2);x.stroke();
    x.beginPath();x.arc(p[0].x,p[0].y,lw*1.2,0,Math.PI*2);x.fill();
  }
}
function tick(){
  requestAnimationFrame(tick);
  if(v.readyState<2||v.currentTime===last)return;
  last=v.currentTime;
  const r=lm.detectForVideo(v,performance.now());
  if(r.faceLandmarks.length){st.hidden=true;draw(r.faceLandmarks[0])}
  else{x.clearRect(0,0,c.width,c.height);st.hidden=false;st.textContent="No et veig la cara"}
}
$("go").onclick=async()=>{
  const b=$("go");b.disabled=true;b.textContent="Carregant…";
  try{
    v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}},audio:false});
    await v.play();
    c.width=v.videoWidth;c.height=v.videoHeight;
    const fit=()=>{const k=Math.min(innerWidth/c.width,innerHeight/c.height);v.style.width=c.style.width=c.width*k+"px";v.style.height=c.style.height=c.height*k+"px"};
    fit();addEventListener("resize",fit);
    const fs=await FilesetResolver.forVisionTasks(BASE+"/wasm");
    const o=d=>({baseOptions:{modelAssetPath:MODEL,delegate:d},runningMode:"VIDEO",numFaces:1});
    try{lm=await FaceLandmarker.createFromOptions(fs,o("GPU"))}catch(e){lm=await FaceLandmarker.createFromOptions(fs,o("CPU"))}
    $("msg").remove();tick();
  }catch(e){
    b.disabled=false;b.textContent="Torna-ho a provar";
    $("info").textContent=e.name==="NotAllowedError"?"Permet l’accés a la càmera (la pàgina ha d’estar en HTTPS o a localhost).":"Error: "+e.message;
  }
};
</script>
</body>
</html>
