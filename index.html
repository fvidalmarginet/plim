<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prova d’ulleres en directe</title>
<style>
:root{--bg:#14181d;--panel:#1d232b;--line:#313a47;--text:#eef1f4;--mute:#97a2b1;--acc:#8fd6cb;box-sizing:border-box}
*{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 32px}
h1{font:600 1.5rem/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--mute)}
#stage{position:relative;width:100%;aspect-ratio:4/3;background:#0b0e11;border:1px solid var(--line);border-radius:10px;overflow:hidden}
#stage video,#stage canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1)}
#cover{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center;padding:20px;background:#0b0e11;z-index:2}
#cover small{color:var(--mute);max-width:36ch}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.go{background:var(--acc);color:#0b1412;border-color:var(--acc);font-weight:600;padding:12px 22px}
#status{position:absolute;left:10px;bottom:10px;z-index:1;font-size:.85rem;background:#000a;padding:3px 9px;border-radius:6px}
#models{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
#models button{display:flex;align-items:center;gap:8px}
#models button[aria-pressed=true]{border-color:var(--acc);background:#243238}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid #fff4}
.row{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
label{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:.9rem}
input[type=range]{accent-color:var(--acc);width:150px}
</style>
</head>
<body>
<main>
  <h1>Prova’t unes ulleres en directe</h1>
  <p class="sub">Segueix el teu cap en 3D, amb rotació real. El vídeo es processa al teu dispositiu.</p>
  <div id="stage">
    <video id="v" playsinline muted></video>
    <canvas id="c"></canvas>
    <div id="status" hidden></div>
    <div id="cover">
      <button class="go" id="start">Activa la càmera</button>
      <small>Cal permetre l’accés a la càmera i tenir connexió per descarregar el detector de cares (uns 4 MB).</small>
    </div>
  </div>
  <div id="models" role="group" aria-label="Models d’ulleres"></div>
  <div class="row">
    <label>Mida <input type="range" id="size" min="90" max="115" value="100"></label>
    <label>Alçada <input type="range" id="lift" min="-10" max="10" value="0"></label>
    <button id="snap">Desa una foto</button>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
import {FaceLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const BASE="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL="https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
const FOV=63, PD=6.3, ZF=1.4; // vertical FOV of MediaPipe's camera, mean pupil distance (cm), frame plane in front of pupils (cm)
const $=id=>document.getElementById(id);
const video=$("v"),canvas=$("c"),statusEl=$("status");
const say=t=>{statusEl.hidden=!t;statusEl.textContent=t||""};

/* ---------- Models ---------- */
const SPECS=[
 {name:"Clàssica negra",type:"way",w:4.5,h:3.3,rim:.7,dep:.55,col:0x15171a,lens:0x1b1b1b,op:.55,hex:"#15171a",temple:[.22,.5]},
 {name:"Rodona daurada",type:"round",w:5.4,h:5.4,rim:.22,dep:.28,col:0xcaa34a,lens:0x4a5a45,op:.3,hex:"#caa34a",temple:[.16,.16],pads:1},
 {name:"Aviador",type:"avi",w:5.4,h:4.6,rim:.2,dep:.28,col:0xc9ced4,lens:0x2c3b34,op:.6,hex:"#c9ced4",temple:[.16,.16],pads:1},
 {name:"Cat-eye carei",type:"cat",w:4.6,h:3.4,rim:.6,dep:.5,col:0x7a3f1c,lens:0xd9a0a8,op:.18,hex:"#7a3f1c",temple:[.22,.45]},
 {name:"Quadrada blava",type:"rect",w:5.2,h:3.4,rim:.3,dep:.35,col:0x2a4f9e,lens:0xbfd4ff,op:.12,hex:"#2a4f9e",temple:[.2,.3]}
];
function outline(type,w,h,n=96){
  const e={round:2,rect:4,way:3.2,avi:2,cat:2.4}[type],pts=[];
  for(let i=0;i<n;i++){
    const t=i/n*Math.PI*2,c=Math.cos(t),s=Math.sin(t);
    let x=Math.sign(c)*Math.pow(Math.abs(c),2/e)*w/2,y=Math.sign(s)*Math.pow(Math.abs(s),2/e)*h/2;
    const yn=y/(h/2);
    if(type==="way")x*=1+.07*yn;
    if(type==="avi"){x*=1-.2*Math.max(0,-yn);if(y<0)y*=1.12}
    if(type==="cat"){y+=.3*(h/2)*Math.max(0,x/(w/2));if(yn<0)x*=.92}
    pts.push(new THREE.Vector2(x,y));
  }
  return pts;
}
function bar(a,b,tx,ty,mat){
  const d=new THREE.Vector3().subVectors(b,a),L=d.length();
  const m=new THREE.Mesh(new THREE.BoxGeometry(tx,ty,L),mat);
  m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),d.normalize());
  return m;
}
function buildGlasses(s){
  const g=new THREE.Group(),half=new THREE.Group();
  const fm=new THREE.MeshPhongMaterial({color:s.col,shininess:90,specular:0x666666,side:THREE.DoubleSide});
  const lm=new THREE.MeshPhongMaterial({color:s.lens,transparent:true,opacity:s.op,shininess:140,specular:0xffffff,side:THREE.DoubleSide,depthWrite:false});
  const lp=outline(s.type,s.w,s.h),op=outline(s.type,s.w+2*s.rim,s.h+2*s.rim);
  const sh=new THREE.Shape(op);sh.holes.push(new THREE.Path(lp));
  const fr=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:s.dep,bevelEnabled:false}),fm);
  fr.position.set(PD/2,0,ZF-s.dep/2);half.add(fr);
  const ln=new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(lp)),lm);
  ln.position.set(PD/2,0,ZF);half.add(ln);
  const yb=s.h/2*.45,[tx,ty]=s.temple,ox=PD/2+(s.w+2*s.rim)/2-.1;
  half.add(bar(new THREE.Vector3(0,yb,ZF),new THREE.Vector3(PD/2-s.w/2+.25,yb,ZF),Math.max(.3,s.rim*.6),s.dep,fm));
  const back=new THREE.Vector3(ox+1,yb-.3,ZF-11);
  half.add(bar(new THREE.Vector3(ox,yb,ZF),back,tx,ty,fm));
  half.add(bar(back,new THREE.Vector3(ox+.9,yb-2.3,ZF-12.2),tx,ty,fm));
  if(s.pads){for(const y of[-.9]){const p=new THREE.Mesh(new THREE.SphereGeometry(.28,12,8),fm);p.position.set(1.15,y,ZF-.8);half.add(p)}}
  const left=half.clone();left.scale.x=-1;
  g.add(half,left);
  // invisible head: hides the arm on the far side when the head turns
  const occ=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),new THREE.MeshBasicMaterial({colorWrite:false}));
  occ.scale.set(7,9.5,8.5);occ.position.set(0,-1.5,-8.5);occ.renderOrder=-1;g.add(occ);
  const rig=new THREE.Group();rig.add(g);
  rig.visible=false;return rig;
}

/* ---------- 3D scene ---------- */
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(FOV,4/3,.1,1000);
scene.add(new THREE.AmbientLight(0xffffff,.85));
const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(.4,1,1);scene.add(dl);
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const rigs=SPECS.map(buildGlasses);rigs.forEach(r=>scene.add(r));
let cur=0;
const box=$("models");
function pick(i){cur=i;[...box.children].forEach((b,j)=>b.setAttribute("aria-pressed",j===i));}
const none=document.createElement("button");
SPECS.forEach((s,i)=>{const b=document.createElement("button");b.innerHTML=`<span class="dot" style="background:${s.hex}"></span>${s.name}`;b.onclick=()=>pick(i);box.append(b)});
const nb=document.createElement("button");nb.textContent="Sense ulleres";nb.onclick=()=>pick(-1);box.append(nb);
pick(0);

/* ---------- Smoothing (One Euro filter) ---------- */
class OE{constructor(mc,b){this.mc=mc;this.b=b;this.x=null}
  reset(){this.x=null}
  f(v,t){if(this.x===null){this.x=v;this.dx=0;this.t=t;return v}
    const dt=Math.max((t-this.t)/1000,.001);this.t=t;
    const al=c=>{const r=2*Math.PI*c*dt;return r/(r+1)};
    this.dx+=al(1)*((v-this.x)/dt-this.dx);
    this.x+=al(this.mc+this.b*Math.abs(this.dx))*(v-this.x);return this.x}}
const fx=new OE(2.5,40),fy=new OE(2.5,40),fu=new OE(2,60),fd=new OE(1.2,.1);
const qs=new THREE.Quaternion();let haveQ=false;
const M4=new THREE.Matrix4(),P=new THREE.Vector3(),Q=new THREE.Quaternion(),S=new THREE.Vector3(),V=new THREE.Vector3();

/* ---------- Tracking ---------- */
let lm=null,vw=640,vh=480,last=-1;
function update(r,t){
  rigs.forEach(g=>g.visible=false);
  if(!r.faceLandmarks.length||!r.facialTransformationMatrixes.length){[fx,fy,fu,fd].forEach(f=>f.reset());haveQ=false;say("No et veig la cara");return}
  say("");
  const L=r.faceLandmarks[0];
  M4.fromArray(r.facialTransformationMatrixes[0].data).decompose(P,Q,S);
  const d0=-P.z;if(d0<1)return;
  const a=L[468],b=L[473],tH=Math.tan(FOV*Math.PI/360),asp=vw/vh;
  const nx=fx.f(a.x+b.x-1,t),ny=fy.f(1-(a.y+b.y),t),d=fd.f(d0,t);
  // size relative to depth: precise on screen whatever the depth estimate
  const ux=(a.x-b.x)*2*tH*asp,uy=(a.y-b.y)*2*tH;
  const k=Math.max(.5,Math.hypot(V.set(1,0,0).applyQuaternion(Q).x,V.y));
  const u=fu.f(Math.hypot(ux,uy)/k,t);
  if(!haveQ){qs.copy(Q);haveQ=true}else qs.slerp(Q,.55);
  const g=rigs[cur];if(!g)return;
  g.visible=true;
  g.position.set(nx*tH*asp*d,ny*tH*d,-d);
  g.quaternion.copy(qs);
  g.scale.setScalar(u*d/PD*$("size").value/100);
  g.children[0].position.y=$("lift").value/10;
}
function tick(){
  requestAnimationFrame(tick);
  if(!lm||video.readyState<2)return;
  if(video.currentTime!==last){last=video.currentTime;update(lm.detectForVideo(video,performance.now()),performance.now())}
  renderer.render(scene,cam);
}

/* ---------- Start ---------- */
$("start").onclick=async()=>{
  const btn=$("start");btn.disabled=true;btn.textContent="Carregant…";
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}},audio:false});
    video.srcObject=stream;await video.play();
    vw=video.videoWidth;vh=video.videoHeight;
    $("stage").style.aspectRatio=vw+"/"+vh;
    renderer.setSize(vw,vh,false);cam.aspect=vw/vh;cam.updateProjectionMatrix();
    const fs=await FilesetResolver.forVisionTasks(BASE+"/wasm");
    const o=dl=>({baseOptions:{modelAssetPath:MODEL,delegate:dl},runningMode:"VIDEO",numFaces:1,outputFacialTransformationMatrixes:true});
    try{lm=await FaceLandmarker.createFromOptions(fs,o("GPU"))}catch(e){lm=await FaceLandmarker.createFromOptions(fs,o("CPU"))}
    $("cover").remove();tick();
  }catch(e){
    btn.disabled=false;btn.textContent="Torna-ho a provar";
    $("cover").querySelector("small").textContent="No s’ha pogut iniciar: "+(e.name==="NotAllowedError"?"has de permetre l’accés a la càmera.":"comprova la connexió i obre la pàgina en un navegador d’ordinador (Chrome, Edge o Safari).");
  }
};
$("snap").onclick=()=>{
  if(!lm)return;
  const c=document.createElement("canvas");c.width=vw;c.height=vh;const x=c.getContext("2d");
  x.translate(vw,0);x.scale(-1,1);x.drawImage(video,0,0,vw,vh);renderer.render(scene,cam);x.drawImage(canvas,0,0,vw,vh);
  const a=document.createElement("a");a.href=c.toDataURL("image/png");a.download="ulleres.png";a.click();
};
</script>
</body>
</html>
